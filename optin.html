<html lang="en">
<head>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Unbounded';
            src: url('https://the99sports.com/assets/fonts/Unbounded.ttf') format('truetype');
            font-weight: 100 900;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0A0A0A;
            --bg-secondary: #111111;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent: #D4AF37;
            --accent-glow: rgba(212, 175, 55, 0.5);
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Grid */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            z-index: 0;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glow Orb */
        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow), transparent 70%);
            filter: blur(100px);
            opacity: 0.3;
            animation: orb-float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb-1 {
            top: -300px;
            left: -300px;
        }

        .glow-orb-2 {
            bottom: -300px;
            right: -300px;
            animation-delay: 10s;
        }

        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 100px) scale(0.9); }
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 48px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            height: 32px;
        }

        .logo img {
            height: 100%;
            width: auto;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 48px 48px;
            z-index: 2;
        }

        .hero-content {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-left {
            text-align: left;
        }

        .hero-left .floating-badge {
            margin-left: 0;
            margin-right: 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .hero-right {
            position: relative;
        }

        .image-container {
            position: relative;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(212, 175, 55, 0.3),
                0 0 120px rgba(212, 175, 55, 0.1);
            background: var(--glass);
            animation: image-glow 4s ease-in-out infinite;
        }

        @keyframes image-glow {
            0%, 100% {
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 80px rgba(212, 175, 55, 0.3),
                    0 0 120px rgba(212, 175, 55, 0.1);
            }
            50% {
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 100px rgba(212, 175, 55, 0.4),
                    0 0 140px rgba(212, 175, 55, 0.2);
            }
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.9;
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
            pointer-events: none;
        }

        /* Floating Badge */
        .floating-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 100px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }

        .badge-text {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        /* Hero Typography */
        .hero-title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 32px;
            position: relative;
        }

        .title-line {
            display: block;
            position: relative;
        }

        .title-glow {
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow);
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 40px var(--accent-glow); }
            50% { text-shadow: 0 0 60px var(--accent-glow), 0 0 80px var(--accent-glow); }
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 48px;
            line-height: 1.5;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 800px;
            margin: 0 auto 64px;
        }

        .stat-card {
            padding: 32px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            display: block;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        /* CTA Button */
        .cta-wrapper {
            position: relative;
            display: inline-block;
        }

        .cta-button {
            position: relative;
            padding: 20px 48px;
            background: linear-gradient(135deg, var(--accent), rgba(212, 175, 55, 0.8));
            color: var(--bg-primary);
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            z-index: 1;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .cta-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .cta-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: var(--accent);
            filter: blur(40px);
            opacity: 0.3;
            border-radius: 100px;
            pointer-events: none;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        /* Visual Section */
        .visual-section {
            padding: 120px 48px;
            position: relative;
            z-index: 2;
        }

        .visual-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .section-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        /* Email Preview */
        .email-preview {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .email-preview::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, var(--accent), transparent);
            border-radius: 32px;
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: border-rotate 3s linear infinite;
        }

        @keyframes border-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .email-preview:hover::before {
            opacity: 1;
        }

        .email-window {
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
        }

        .email-header {
            padding: 16px 24px;
            background: var(--glass);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .window-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border);
        }

        .window-dot.active {
            background: var(--accent);
        }

        .email-content {
            padding: 32px;
        }

        .email-line {
            margin-bottom: 24px;
            padding: 20px;
            background: var(--glass);
            border-left: 2px solid var(--accent);
            border-radius: 8px;
            position: relative;
            transition: all 0.3s ease;
        }

        .email-line:hover {
            transform: translateX(8px);
            background: rgba(212, 175, 55, 0.05);
        }

        .line-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-weight: 700;
            font-size: 12px;
            margin-right: 12px;
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
            margin-top: 64px;
        }

        .result-card {
            padding: 32px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .result-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scan 3s linear infinite;
        }

        .result-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
        }

        .result-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), rgba(212, 175, 55, 0.5));
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--bg-primary);
        }

        .result-amount {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .result-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-detail {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Footer */
        .footer {
            padding: 64px 48px;
            text-align: center;
            border-top: 1px solid var(--border);
            position: relative;
            z-index: 2;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: 24px;
            padding: 48px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 100px var(--accent-glow);
            animation: modal-enter 0.3s ease;
        }

        @keyframes modal-enter {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--accent);
            color: var(--bg-primary);
            transform: rotate(90deg);
        }

        .modal-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 16px;
            text-align: center;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .submit-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent), rgba(212, 175, 55, 0.8));
            color: var(--bg-primary);
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .submit-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-button:hover::before {
            width: 600px;
            height: 600px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px var(--accent-glow);
        }

        /* Phone Input */
        .iti {
            width: 100%;
        }

        .iti__flag-container {
            background: transparent;
            border-right: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 48px;
            }

            .hero-left {
                text-align: center;
            }

            .stats-grid {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .hero {
                padding: 120px 24px 60px;
            }

            .hero-title {
                font-size: 32px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .visual-section {
                padding: 80px 24px;
            }

            .email-preview {
                padding: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .image-container {
                margin-top: 32px;
            }
        }
    </style>

    <script>
        // Parallax effect on scroll
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const orbs = document.querySelectorAll('.glow-orb');
            orbs.forEach((orb, index) => {
                const speed = index === 0 ? 0.5 : 0.3;
                orb.style.transform = `translateY(${scrolled * speed}px)`;
            });
        });

        // Modal functions
        let iti;

        function openModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            if (!iti) {
                const phoneInput = document.querySelector("#phone");
                iti = window.intlTelInput(phoneInput, {
                    initialCountry: "us",
                    preferredCountries: ['us', 'ca', 'gb', 'au'],
                    separateDialCode: true,
                    nationalMode: false,
                    formatOnDisplay: true,
                    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
                });

                fetch('https://ipapi.co/json/')
                    .then(res => res.json())
                    .then(data => {
                        if (data.country_code) {
                            iti.setCountry(data.country_code.toLowerCase());
                        }
                    })
                    .catch(() => iti.setCountry('us'));
            }
            
            setTimeout(() => {
                document.getElementById('firstName').focus();
            }, 100);
        }

        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        document.getElementById('popup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitButton = this.querySelector('.submit-button');
            const originalText = submitButton.innerHTML;
            submitButton.disabled = true;
            submitButton.innerHTML = 'PROCESSING...';
            
            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: iti ? iti.getNumber() : document.getElementById('phone').value,
                phoneCountry: iti ? iti.getSelectedCountryData().iso2 : 'us',
                source: 'brand-deal-template-futuristic',
                timestamp: new Date().toISOString()
            };
            
            const ZAPIER_WEBHOOK = 'https://hooks.zapier.com/hooks/catch/24186094/uc9dmxb/';
            
            try {
                await fetch(ZAPIER_WEBHOOK, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                const modalContent = document.querySelector('.modal-content');
                modalContent.innerHTML = `
                    <button class="modal-close" onclick="closeModal()">×</button>
                    <div style="text-align: center; padding: 40px 20px;">
                        <div style="width: 80px; height: 80px; margin: 0 auto 24px; background: linear-gradient(135deg, var(--accent), transparent); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <svg width="40" height="40" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                            </svg>
                        </div>
                        <h3 style="font-size: 32px; font-weight: 700; margin-bottom: 16px;">CHECK YOUR EMAIL!</h3>
                        <p style="color: var(--white); font-size: 20px; margin-bottom: 8px;">We sent the template to:</p>
                        <p style="color: var(--accent); font-size: 18px; margin-bottom: 24px;">${data.email}</p>
                        <p style="color: var(--text-secondary); font-size: 16px; line-height: 1.5;">
                            It should arrive in the next 60 seconds.<br>
                            <strong style="color: var(--white);">Can't find it?</strong> Check your spam folder or promotions tab.
                        </p>
                    </div>
                `;
                
                setTimeout(closeModal, 4000);
                
            } catch (error) {
                console.error('Error:', error);
                submitButton.disabled = false;
                submitButton.innerHTML = originalText;
            }
        });

        // Animate stats on load
        const animateValue = (element, start, end, duration, suffix = '') => {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                element.textContent = Math.floor(progress * (end - start) + start) + suffix;
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        };

        // Trigger animations when stats come into view
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const statNumbers = entry.target.querySelectorAll('.stat-number');
                    statNumbers.forEach(stat => {
                        const text = stat.textContent;
                        if (text.includes('%')) {
                            animateValue(stat, 0, 87, 2000, '%');
                        } else if (text.includes('hrs')) {
                            stat.textContent = '48hrs';
                        } else if (text.includes('K')) {
                            animateValue(stat, 0, 30, 2000, 'K');
                        }
                    });
                    observer.unobserve(entry.target);
                }
            });
        });

        const statsGrid = document.querySelector('.stats-grid');
        if (statsGrid) {
            observer.observe(statsGrid);
        }
    </script>
</body>
</html>
